<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Объект — SpbRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar bg-white border-bottom">
    <div class="container py-2"><a class="navbar-brand brand" href="index.html">Spb<span>Rent</span></a><a
            href="search.html" class="link-gold">К поиску</a></div>
</nav>
<main class="container py-5">
    <div class="row g-5 align-items-start">
        <div class="col-lg-6">
            <div class="property-image image-one detail-image"></div>
        </div>
        <div class="col-lg-6"><p class="eyebrow">КВАРТИРА · ПРИМОРСКИЙ РАЙОН</p>
            <h1 class="section-title">Светлая квартира у парка</h1>
            <p class="lead">65 000 ₽ <small class="text-muted">/ месяц</small></p>
            <p class="text-muted">2 комнаты · 54 м² · 8 этаж</p>
            <p>Тихая квартира рядом с парком и метро. Есть мебель, техника и закрытый двор.</p>
            <button class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#requestModal">Записаться на просмотр
            </button>
            <p id="requestResult" class="text-success mt-3"></p></div>
    </div>
</main>
<div class="modal fade" id="requestModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h2 class="h5 modal-title">Заявка на просмотр</h2>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="requestForm">
                <div class="modal-body"><input class="form-control mb-3" required placeholder="Ваше имя"><input
                        class="form-control" type="tel" required placeholder="Телефон"></div>
                <div class="modal-footer">
                    <button class="btn btn-primary" type="submit">Отправить</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
