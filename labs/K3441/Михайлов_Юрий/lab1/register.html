<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — SpbRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar bg-white border-bottom">
    <div class="container py-2"><a class="navbar-brand brand" href="index.html">Spb<span>Rent</span></a><a
            href="login.html" class="link-gold">Войти</a></div>
</nav>
<main class="auth-wrap">
    <div class="auth-card"><p class="eyebrow">SPBRENT</p>
        <h1 class="h2 mb-4">Создать аккаунт</h1>
        <form id="registerForm"><label class="form-label">Имя</label><input name="name" required
                                                                            class="form-control mb-3" type="text"
                                                                            placeholder="Ваше имя"><label
                class="form-label">Email</label><input name="email" required class="form-control mb-3" type="email"
                                                       placeholder="you@example.com"><label
                class="form-label">Пароль</label>
            <div class="input-group mb-4"><input id="password" name="password" required class="form-control"
                                                 type="password" placeholder="Не менее 6 символов">
                <button class="btn btn-outline-secondary" type="button" data-toggle-password="#password">Показать
                </button>
            </div>
            <button class="btn btn-gold w-100" type="submit">Зарегистрироваться</button>
        </form>
    </div>
</main>
<script src="js/app.js"></script>
</body>
</html>
