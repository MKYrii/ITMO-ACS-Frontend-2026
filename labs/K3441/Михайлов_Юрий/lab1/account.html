<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Личный кабинет — SpbRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar bg-white border-bottom">
    <div class="container py-2">
        <a class="navbar-brand brand" href="index.html">Spb<span>Rent</span></a>
        <a href="search.html" class="link-gold">К поиску</a>
    </div>
</nav>
<main class="container py-5">
    <p class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</p>
    <h1 class="section-title mb-4">Мои объекты</h1>
    <div class="row g-4">
        <div class="col-md-6">
            <a href="transaction.html" class="property-card p-4 d-block text-decoration-none text-dark">
                <p class="eyebrow">АРЕНДУЕТЕ</p>
                <h2 class="h4">Светлая квартира у парка</h2>
                <p class="text-muted">65 000 ₽ / месяц · до 12.10.2026</p>
                <span class="badge text-bg-success">Активна</span>
            </a>
        </div>
        <div class="col-md-6">
            <div class="property-card p-4">
                <p class="eyebrow">ИСТОРИЯ</p>
                <h2 class="h4">Мои сообщения и сделки</h2>
                <p class="text-muted">2 сообщения · 1 завершённая сделка</p>
                <a href="messages.html" class="btn btn-primary">Открыть историю</a>
            </div>
        </div>
    </div>

</html>
