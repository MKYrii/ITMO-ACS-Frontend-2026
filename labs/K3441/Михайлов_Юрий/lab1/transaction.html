<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сделка — SpbRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar bg-white border-bottom">
    <div class="container py-2"><a class="navbar-brand brand" href="index.html">Spb<span>Rent</span></a><a
            href="messages.html" class="link-gold">Назад к истории</a></div>
</nav>
<main class="container py-5"><p class="eyebrow">АКТИВНАЯ СДЕЛКА</p>
    <div class="row g-4 mb-5">
        <div class="col-md-5">
            <div class="property-image image-one detail-image"></div>
        </div>
        <div class="col-md-7"><h1 class="section-title">Светлая квартира у парка</h1>
            <p class="text-muted">Приморский район, Санкт-Петербург</p>
            <p class="lead">65 000 ₽ <small class="text-muted">/ месяц</small></p>
            <div class="row g-3 small">
                <div class="col-4"><strong>54 м²</strong><br><span class="text-muted">площадь</span></div>
                <div class="col-4"><strong>2 комнаты</strong><br><span class="text-muted">планировка</span></div>
                <div class="col-4"><strong>8 этаж</strong><br><span class="text-muted">этаж</span></div>
            </div>
            <span class="badge text-bg-success mt-4">Договор действует</span></div>
    </div>
    <section class="chat-box"><h2 class="h4">Чат по сделке</h2>
        <p class="small text-muted">Получатель: Алексей Смирнов</p>
        <div id="transactionMessages" class="chat-history mb-3">
            <div class="chat-message">Встреча назначена на 24 октября, 18:00.</div>
        </div>
        <form id="transactionMessageForm" class="d-flex gap-2"><input id="transactionMessageText" class="form-control"
                                                                      required placeholder="Напишите сообщение">
            <button class="btn btn-primary" type="submit">Отправить</button>
        </form>
    </section>
</main>
<script src="js/app.js"></script>
<script>document.querySelector('#transactionMessageForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const input = document.querySelector('#transactionMessageText');
    const box = document.querySelector('#transactionMessages');
    const item = document.createElement('div');
    item.className = 'chat-message chat-message-own';
    item.textContent = input.value;
    box.appendChild(item);
    input.value = '';
});</script>
</body>
</html>
